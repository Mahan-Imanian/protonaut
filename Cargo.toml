[workspace]
resolver = "3"
members = ["crates/core", "crates/runtime", "crates/cli"]

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["Protonaut contributors"]
keywords = ["steamos", "proton", "steam-deck", "ci", "gamedev"]
categories = ["development-tools::testing", "command-line-utilities"]
repository = "https://github.com/Mahan-Imanian/protonaut"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"

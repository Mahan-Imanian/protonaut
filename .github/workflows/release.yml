# On a version tag: build the Linux binary, write checksums and an SBOM, and
# create a DRAFT release. A maintainer reviews and publishes it by hand.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

# Never cancel a release halfway; queue a second tag instead.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build release assets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches the crate version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --format-version 1 --no-deps | python3 -c "import json,sys; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='steamos-preflight'))")
          [[ "$TAG" == "v$version" ]] || { echo "::error::tag $TAG does not match crate version $version"; exit 1; }
      - run: cargo test --locked --workspace
      - name: Build
        env:
          TAG: ${{ github.ref_name }}
          SOURCE_DATE_EPOCH: "0"
        run: |
          RUSTFLAGS="--remap-path-prefix=$PWD=. --remap-path-prefix=$HOME=~" cargo build --locked --release
          mkdir -p dist
          name="steamos-preflight-${TAG}-x86_64-unknown-linux-gnu"
          install -m 0755 target/release/steamos-preflight "dist/$name"
          cargo metadata --format-version 1 --locked > "dist/cargo-metadata-${TAG}.json"
          (cd dist && sha256sum ./* > SHA256SUMS)
          cat dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist
          retention-days: 7

  draft:
    name: Create draft release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the draft GitHub Release and upload its assets
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "$TAG" --notes "Draft created by the release workflow. Paste the CHANGELOG section here, review the assets and checksums, then publish."

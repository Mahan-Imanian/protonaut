[package]
name = "protonaut"
description = "Automated compatibility testing for Windows games targeting SteamOS."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
nix = { version = "0.31.3", features = ["hostname", "user", "feature", "fs"] }
protonaut-core = { version = "0.2.1", path = "../core" }
protonaut-runtime = { version = "0.2.1", path = "../runtime" }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal"] }
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"

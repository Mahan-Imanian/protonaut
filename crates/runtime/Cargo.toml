[package]
name = "protonaut-runtime"
description = "Proton runtime, virtual display and process supervision for Protonaut."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
hex = "0.4.3"
nix = { version = "0.31.3", features = ["signal", "process", "user", "fs"] }
png = "0.18.1"
protonaut-core = { version = "0.2.1", path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["process", "time", "rt", "macros", "io-util", "fs", "signal", "sync"] }
toml = "1.2.0"
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
